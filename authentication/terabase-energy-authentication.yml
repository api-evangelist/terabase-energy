credential_lifecycle:
  issue: Company admin generates a Client ID + Secret per user in the PlantPredict UI.
  rotate: >-
    POST /Company/{companyId}/User/{userId}/Secret (Generate API credentials for a user) rotates the pair and
    invalidates any previously issued credentials.
  retrieval: The secret is returned only in the generation response and cannot be retrieved later.
