  tokenUrl: https://mcp.plantpredict.terabase.energy/token
  registrationUrl: https://mcp.plantpredict.terabase.energy/register
  pkce: S256
  grant_types:
  - authorization_code
  - refresh_token
  token_endpoint_auth_methods:
  - client_secret_post
  - client_secret_basic
  description: >-
    Dynamic client registration (RFC 7591) plus authorization-code with PKCE, advertised via RFC 8414 authorization
    server metadata and RFC 9728 protected-resource metadata. Users sign in once with their PlantPredict email and
    password; the connector acts as the user with the user's own permissions.
