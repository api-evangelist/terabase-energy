  note: >-
    The PlantPredict OpenAPI advertises a single `bearerAuth` HTTP bearer scheme, but the API description states
    plainly that tokens are obtained through an OAuth 2.0 client-credentials exchange against AWS Cognito. The
    provider documents why: "Most users have access to the production tenant only, and we don't want to invite anyone
    to enter long-lived client_id / client_secret credentials into a third-party documentation site." The separate
    MCP connector uses OAuth 2.0 authorization code + PKCE.
