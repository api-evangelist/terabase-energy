        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /Project/{projectId}/Prediction/{predictionId}/ShadeScene/Results:
    get:
      tags:
      - ShadeScene
      summary: Get 3D shade calculation results
      description: "Returns all 3D scene related results. This includes:\n\n- Beam Irradiance losses\n    \n- Shading Electrical Effect losses\n    \n- Transposition losses/gains\n    \n- Combined loss/gain calculations.\n"
      operationId: getShadeResults
      x-doc-source: postman
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
      - name: predictionId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Shade results
          content:
            application/json:
              schema:
                type: object
                properties:
                  uiShadeData:
                    type: object
                  transpositionFactors:
                    type: object
                  hasScheduledData:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  schemas:
    ModelStateError:
      type: object
      description: 'ASP.NET Web API validation error. `modelState` maps the offending

        field name (or `request`) to a list of human-readable messages.

        '
      properties:
        message:
          type: string
        modelState:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - message
    ProcessingStatus:
      type: object
      properties:
        Id:
          type: integer
        RunId:
          type: integer
        PercentComplete:
          type: number
        ProcessingStatus:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          x-enum-varnames:
          - None
          - Queued
          - Running
          - Success
          - Error
          - Cancelled
          description: ProcessingStatusEnum
        LastPublishedDateToQueue:
          type: string
          description: ISO-8601 datetime as returned by the PlantPredict API. May or may not include a timezone offset; treat as server-local when no offset is present.
        RunStartedDateTimeUTC:
          type: string
          description: ISO-8601 datetime as returned by the PlantPredict API. May or may not include a timezone offset; treat as server-local when no offset is present.
        RunCompletedDateTimeUTC:
          type: string
          description: ISO-8601 datetime as returned by the PlantPredict API. May or may not include a timezone offset; treat as server-local when no offset is present.
    ShadeSceneProperties:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        createdDateUTC:
          type: string
          description: ISO-8601 datetime as returned by the PlantPredict API. May or may not include a timezone offset; treat as server-local when no offset is present.
        createdById:
          type: integer
        sceneSurfaceArea:
          type: number
        dcFieldSurfaceArea:
          type: number
        collectorCount:
          type: integer
        objectCount:
          type: integer
        orientationTargetDCField:
          type: integer
        calculationSettingsTargetDCField:
          type: integer
        siteTableCount:
          type: integer
        rotation:
          type: number
        binType:
          type: integer
          enum:
          - 0
          - 1
          - 2
          x-enum-varnames:
          - Quick
          - Balanced
          - Detailed
          description: ShadeSceneBinTypes
        collectorType:
          type: integer
          enum:
          - 0
          - 1
          - 2
          x-enum-varnames:
          - FixedTilt
          - SingleAxisTracker
          - Mixed
          description: CollectorType
        trackerRotationModel:
          type: integer
          enum:
          - 0
          - 1
          - 2
          x-enum-varnames:
          - RepresentativeDCField
          - TimeSeriesSchedule
          - TerrainAwareBacktracking
          description: TrackerRotationModel
        shadingModel:
          type: integer
          enum:
          - 0
          - 1
          x-enum-varnames:
          - DCField
          - SiteShadeScene
          description: Shading3DModel
        fractionalShadingPercentage:
          type: number
        numberOfModuleFractions:
          type: integer
        shadeObjectType:
          type: integer
          enum:
          - 0
          - 1
          x-enum-varnames:
          - BoundingBoxFast
          - NoneHighFidelity
          description: ShadeObjectType
  responses:
    BadRequest:
      description: "The request was rejected. PlantPredict returns one of two shapes:\n\n* `application/json` with `{message, modelState}` for input\n  validation errors (ASP.NET Web API model-state). The `modelState`\n  map keys field names to lists of human-readable error messages.\n* `text/plain` with a free-form message for runtime / database\n  errors that bubble up before validation completes.\n\nClients should branch on the `Content-Type` header.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelStateError'
          example:
            message: The request is invalid.
            modelState:
              latitude:
              - The field Latitude must be between -90 and 90.
        text/plain:
          schema:
            type: string
          example: A successfully completed prediction cannot be cancelled.
    Unauthorized:
      description: Missing or invalid bearer token. The response body is empty and no `Content-Type` header is set; the 401 status code is the only signal. Fetch a fresh token (see the **Authentication** section of the API description) and retry.
    NotFound:
      description: The referenced resource does not exist or is not accessible to the caller.
      content:
        text/plain:
          schema:
            type: string
          example: Project not found.
    ServerError:
      description: 'Unexpected server-side error. The body is usually a plain-text message

        but its structure is not guaranteed — treat it as opaque diagnostic

        text. Common causes: database constraint violation, downstream

        service timeout, internal exception. Retry-safe for idempotent

        requests; for non-idempotent ones, verify state before retrying.

        '
      content:
        text/plain:
          schema:
            type: string
          example: An error has occurred.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Pass `Authorization: Bearer <token>` on every request. See the **Authentication** section of the API description for how to fetch a token.'
