                    RunStartedDateTimeUTC: '2025-11-25T16:59:50.513'
                    RunCompletedDateTimeUTC: '2025-11-25T17:00:32.183'
                    IsInverterMultiRun: false
                    InverterRunSuccesses: 0
                    InverterRunFailures: 0
                    InverterRunInfo: []
