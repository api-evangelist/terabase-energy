        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /Project/{projectId}/Prediction/{predictionId}/TABT/ProcessingStatus:
    get:
      tags:
      - ShadeScene
      summary: Get TABT processing status
      description: "Returns the status for:\n\n- Transposition Factor Calculations (if necessary)\n    \n- Terrain Aware Calculations\n    \n- Overall Status (Transpositions + Terrain)\n    \n\nRefer to /Definitions endpoint for status' and their meanings.\n"
      operationId: getTABTProcessingStatus
      x-doc-source: postman
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
      - name: predictionId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: TABT status
          content:
            application/json:
              schema:
                type: object
                properties:
                  Id:
                    type: integer
                  RunId:
                    type: integer
                  PercentComplete:
                    type: number
                  EngineProcessingStatus:
                    type: integer
                  OptimizationProcessingStatus:
                    type: integer
                  TranspositionProcessingStatus:
                    type: integer
                  LastPublishedDateToQueue:
                    type: string
                    description: ISO-8601 datetime as returned by the PlantPredict API. May or may not include a timezone offset; treat as server-local when no offset is present.
                  RunStartedDateTimeUTC:
                    type: string
                    description: ISO-8601 datetime as returned by the PlantPredict API. May or may not include a timezone offset; treat as server-local when no offset is present.
                  RunCompletedDateTimeUTC:
                    type: string
                    description: ISO-8601 datetime as returned by the PlantPredict API. May or may not include a timezone offset; treat as server-local when no offset is present.
              examples:
                postman-new-request:
                  value:
                    Id: 802
                    RunId: 955415-DJYHQLJVVN
                    PercentComplete: 100
                    EngineProcessingStatus: 3
                    OptimizationProcessingStatus: 0
                    TranspositionProcessingStatus: 3
                    LastPublishedDateToQueue: '2025-11-25T16:55:14.783'
                    RunStartedDateTimeUTC: '2025-11-25T16:55:15.75'
                    RunCompletedDateTimeUTC: '2025-11-25T16:55:22.033'
        '204':
          description: TABT calculations have not been queued for this prediction yet. Response body is empty.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /Project/{projectId}/Prediction/{predictionId}/ShadeScene/Run:
