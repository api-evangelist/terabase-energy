                    contents: Changing status
                    ownerId: 5093
                    entityType: 2
                    entityID: 41259
                postman-note-2:
                  value: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
