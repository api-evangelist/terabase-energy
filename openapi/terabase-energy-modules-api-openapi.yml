        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /Module/{moduleId}/Note:
    get:
      tags:
      - Modules
      summary: Get notes for a module
      description: Returns the audit-trail notes attached to a module — creation, edits, status changes, and freeform user comments — in reverse chronological order.
      operationId: getModuleNotes
      x-doc-source: drafted
      parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
              examples:
                postman-note:
                  value:
                  - id: 34514
                    date: '2026-02-04T10:03:03.14'
                    contents: Changing status
                    ownerId: 5093
                    entityType: 2
                    entityID: 41259
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /Module/{moduleId}/Note/{noteId}:
    delete:
      tags:
      - Modules
      summary: Delete a module note
      description: Deletes a single note from a module's audit trail. Permanent; intended for cleaning up accidental entries rather than rewriting history.
      operationId: deleteModuleNote
      x-doc-source: drafted
      parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: integer
      - name: noteId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Remaining notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
              examples:
                postman-note:
                  value:
