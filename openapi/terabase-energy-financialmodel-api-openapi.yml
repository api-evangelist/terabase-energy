openapi: 3.2.0
info:
  title: PlantPredict Financial Model API
  version: 12.13.0
  description: '## What is PlantPredict?'
servers:
- url: https://api.plantpredict.terabase.energy
  description: Production
security:
- bearerAuth: []
tags:
- name: FinancialModel
  description: Financial model parameters and cashflow results
paths:
  /Project/{projectId}/Prediction/{predictionId}/FinancialModelParameters:
    get:
      tags:
      - FinancialModel
      summary: Get financial model parameters
      description: 'Returns the persisted financial model inputs and calculations for a prediction.


        **Parameters:**


        - `projectId` (path, required): The project ID.


        - `predictionId` (path, required): The prediction ID.'
      operationId: getFinancialModelParameters
      x-doc-source: postman
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
      - name: predictionId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Financial model parameters
          content:
            application/json:
              schema:
                type: object
              examples:
                postman-get-parameters:
                  value:
                    id: 166274
                    systemSizeAtPOI: 0.15
                    systemInverterCapacity: 0.15
