    post:
      tags:
      - FinancialModel
      summary: Save financial model parameters
      description: 'Takes input parameters and calculates new financial model inputs. Does not persist; returns calculated values.


        **Parameters:**


        - `projectId` (path, required): The project ID.


        - `predictionId` (path, required): The prediction ID.


        - `modelInputs` (body, required): FinancialModelParameters with input values to calculate.'
      operationId: saveFinancialModelParameters
      x-doc-source: postman
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
      - name: predictionId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
