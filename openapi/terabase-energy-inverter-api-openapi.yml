openapi: 3.2.0
info:
  title: PlantPredict Inverter API
  description: The HTTP API used by the PlantPredict web application. This API can also be accessed directly
    by having your Company Admin generate API credentials. If you do not know your Company Admin, contact
    support@plantpredict.com for assistance.
  contact:
    name: PlantPredict Support
    url: https://plantpredict.com/contact/
    email: support@plantpredict.com
  version: current
security:
- Bearer: []
tags:
- name: Inverter
paths:
  /Inverter/{id}:
    get:
      tags:
      - Inverter
      summary: Get an Inverter by Id.
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
            application/json:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
            text/json:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
    delete:
      tags:
      - Inverter
      summary: Delete an Inverter by Id.
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
    put:
      tags:
      - Inverter
      summary: Update an Inverter.
      description: This operation may attach a X-Message header on the response carrying an informational
        message about the updated entity.
      parameters:
      - name: id
        in: path
        description: Inverter ID from URL
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
          application/json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
          text/json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
      responses:
        '200':
          description: OK
  /Inverter:
    get:
      tags:
      - Inverter
      summary: Get a list of all Inverters to which you have access.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
    post:
      tags:
      - Inverter
      summary: Create a new Inverter.
      description: This operation may attach a X-Message header on the response carrying an informational
        message about the new entity.
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
          application/json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
          text/json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.DTO.CreateEntityInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.DTO.CreateEntityInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.DTO.CreateEntityInfo'
  /Inverter/InverterOverview:
    get:
      tags:
      - Inverter
      summary: Get overview data for all Inverters for which you have access.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantPredict.Entities.DTO.InverterItem'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantPredict.Entities.DTO.InverterItem'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantPredict.Entities.DTO.InverterItem'
  /Inverter/CheckMatch:
    post:
      tags:
      - Inverter
      summary: 'Pre-save content-match check (PP-2570). Returns the accessible library record whose

        content matches the posted inverter - selected by status hierarchy Global > Active >

        Draft-Private > Draft-Shared - or null when nothing matches. Name is excluded from

        identity; Retired records never match. Persists nothing.'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
          application/json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
          text/json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Inverter'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.DTO.AssetMatchResult'
            application/json:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.DTO.AssetMatchResult'
            text/json:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.DTO.AssetMatchResult'
  /Inverter/{inverterId}/kVA:
    get:
      tags:
      - Inverter
      summary: Get the kVA rating of an Inverter by Id.
      description: Temperature Adjusted kVA sizing of the inverter is determined using the cooling design
        temperature and the elevation and temperature derate curves if applicable, otherwise the 50°C
        kVA rating is used.
      parameters:
      - name: inverterId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      - name: elevation
        in: query
        description: Meters
        schema:
          type: number
          format: double
      - name: temperature
        in: query
        description: Degrees Celsius
        schema:
          type: number
          format: double
      - name: useCoolingTemp
        in: query
        description: ''
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.DTO.InverterKvaInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.DTO.InverterKvaInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.DTO.InverterKvaInfo'
  /Inverter/{inverterId}/Note:
    get:
      tags:
      - Inverter
      summary: Get the Notes for an Inverter by Inverter Id.
      parameters:
      - name: inverterId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantPredict.Entities.Note'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantPredict.Entities.Note'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantPredict.Entities.Note'
  /Inverter/{inverterId}/Note/{noteId}:
    delete:
      tags:
      - Inverter
      summary: Delete a Note for an Inverter by Note Id and Inverter Id.
      parameters:
      - name: inverterId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      - name: noteId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: boolean
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
  /Inverter/Status:
    post:
      tags:
      - Inverter
      summary: Update the Status of a list of Inverters by list of Ids.
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PlantPredict.Entities.DTO.Asset'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PlantPredict.Entities.DTO.Asset'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PlantPredict.Entities.DTO.Asset'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PlantPredict.Entities.DTO.Asset'
      responses:
        '200':
          description: OK
