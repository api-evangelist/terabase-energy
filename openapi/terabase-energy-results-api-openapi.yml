  /Project/{projectId}/Prediction/{predictionId}/AverageEnergy:
    get:
      tags:
      - Results
      summary: Get average energy results
      description: "Returns average energy for a prediction that has completed with results.\n\n**Parameters:**\n\n- `projectId` (path, required): The project ID.\n    \n- `predictionId` (path, required): The prediction ID.\n"
      operationId: getAverageEnergy
      x-doc-source: postman
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
      - name: predictionId
        in: path
        required: true
        schema:
          type: integer
      responses:
