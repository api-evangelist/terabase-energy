  /Project/{projectId}/Prediction/{predictionId}/NodalJson:
    get:
      tags:
      - Results
      summary: Get nodal JSON results
      description: 'Returns time-series nodal data. Scope is determined by the combination of query parameters:

        - No params → System level

        - blockNumber → Block level

        - blockNumber + arrayNumber → Array level

        - blockNumber + arrayNumber + inverterName → Inverter level

        - blockNumber + arrayNumber + inverterName + dcFieldNumber → DC Field level


        Use `nodalParameters` to filter to specific output columns (comma-separated).

        '
      operationId: getNodalJson
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
      - name: predictionId
        in: path
        required: true
        schema:
          type: integer
      - name: blockNumber
        in: query
        schema:
          type: integer
      - name: arrayNumber
        in: query
        schema:
          type: integer
      - name: inverterName
        in: query
        schema:
          type: string
      - name: dcFieldNumber
        in: query
        schema:
          type: integer
      - name: nodalParameters
        in: query
        description: Comma-separated list of output parameter names to include
        schema:
          type: string
      responses:
        '200':
          description: Nodal data
          content:
            application/json:
              schema:
                type: object
              examples:
                postman-block:
