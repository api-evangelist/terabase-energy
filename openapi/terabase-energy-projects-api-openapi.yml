          - Inverter
          - Weather
          - Prediction
          - MultiJunction
          description: EntityType
        entityID:
          type: integer
    PVsystSkippedVariant:
      type: object
      description: 'A PVsyst variant that was not imported because one or more of the files it

        references could not be used.

        '
      properties:
        variantFile:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
          description: Plain-language explanation, suitable to show to a person.
        blockedBy:
          type:
          - array
          - 'null'
          description: The specific file references that blocked this variant.
          items:
            $ref: '#/components/schemas/PVsystBlockingReference'
    PVsystBlockingReference:
      type: object
      description: A file a variant references that could not be used.
      properties:
        category:
          type:
          - string
          - 'null'
          description: The kind of file, e.g. `module`, `inverter`, `weather`.
        fileName:
          type:
          - string
          - 'null'
          description: The referenced filename, e.g. `CS7N-695TB-AG.PAN`.
        problem:
          type:
          - string
          - 'null'
          description: Why it could not be used, e.g. `Not included in the ZIP.`
    ProjectOverview:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        country:
          type: string
        countryCode:
          type: string
        createdDate:
          type: string
          description: ISO-8601 datetime as returned by the PlantPredict API. May or may not include a timezone offset; treat as server-local when no offset is present.
        lastModified:
          type: string
          description: ISO-8601 datetime as returned by the PlantPredict API. May or may not include a timezone offset; treat as server-local when no offset is present.
        elevation:
          type: number
          format: double
        region:
          type: string
        standardOffsetFromUTC:
          type: number
        locality:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        stateProvinceCode:
          type: string
        status:
          type: integer
          enum:
          - 0
          - 1
          - 2
          x-enum-varnames:
          - Active
          - Archived
          - VoltagePro
          description: ProjectStatusEnum
        predictions:
          type: array
          items:
            type: object
    IdResponse:
      type: object
      properties:
        id:
          type: integer
      required:
      - id
    PVsystFailedVariant:
      type: object
      description: A PVsyst variant that errored while the prediction was being created.
      properties:
        variantFile:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
    PVsystImportedVariant:
      type: object
      description: A PVsyst variant that was imported as a prediction.
      properties:
        variantFile:
          type:
          - string
          - 'null'
          description: The PVsyst variant file, e.g. `Desert Ridge.VC0`.
        predictionId:
          type:
          - integer
          - 'null'
          format: int64
          description: The prediction created from this variant.
  responses:
    Unauthorized:
      description: Missing or invalid bearer token. The response body is empty and no `Content-Type` header is set; the 401 status code is the only signal. Fetch a fresh token (see the **Authentication** section of the API description) and retry.
    BadRequest:
      description: "The request was rejected. PlantPredict returns one of two shapes:\n\n* `application/json` with `{message, modelState}` for input\n  validation errors (ASP.NET Web API model-state). The `modelState`\n  map keys field names to lists of human-readable error messages.\n* `text/plain` with a free-form message for runtime / database\n  errors that bubble up before validation completes.\n\nClients should branch on the `Content-Type` header.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelStateError'
          example:
            message: The request is invalid.
            modelState:
              latitude:
              - The field Latitude must be between -90 and 90.
        text/plain:
          schema:
            type: string
          example: A successfully completed prediction cannot be cancelled.
    Forbidden:
      description: 'The bearer token is valid but lacks the OAuth2 scope or role required

        for this operation (e.g. status-change endpoints require elevated

        privileges that not every API client is granted). Response body is

        typically empty.

        '
    NotFound:
      description: The referenced resource does not exist or is not accessible to the caller.
      content:
        text/plain:
          schema:
            type: string
          example: Project not found.
    ServerError:
      description: 'Unexpected server-side error. The body is usually a plain-text message

        but its structure is not guaranteed — treat it as opaque diagnostic

        text. Common causes: database constraint violation, downstream

        service timeout, internal exception. Retry-safe for idempotent

        requests; for non-idempotent ones, verify state before retrying.

        '
      content:
        text/plain:
          schema:
            type: string
          example: An error has occurred.
  securitySchemes:
    bearerAuth:
      type: http
