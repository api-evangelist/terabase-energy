  /Project/Import/PVsyst:
    post:
      tags:
      - Projects
      summary: Import a PVsyst project from a ZIP export
      description: 'Imports a PVsyst project export directly, without using the web application.


        Send the ZIP exactly as PVsyst produced it. The import runs asynchronously and can

        take several minutes, so this returns `202 Accepted` immediately with a job ID. Poll

        `GET /Project/Import/PVsyst/{jobId}` with that ID until the status is `Completed`

        or `Failed`.


        Every variant whose referenced module, inverter and weather files are in the ZIP —

        or which match a record already in your library — is imported. A variant that

        references a file which is absent or unreadable is left out and reported in the

        status response, naming the file so you can fix the export and send it again.

        **Files are never substituted automatically.**


        Unlike the web application there is no review step: everything that can be built is

        built. See the [PVsyst import guide](/api-docs/pvsyst-import) for a full walkthrough.

        '
      operationId: importPVsystProject
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The ZIP file exactly as PVsyst exported it.
              required:
              - file
      responses:
        '202':
          description: 'The import was accepted and is now running. The `Location` header carries the

            status URL. No project exists yet.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PVsystImportStartResult'
              example:
                jobId: 4471
                statusUrl: /Project/Import/PVsyst/4471
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /Project/Import/PVsyst/{jobId}:
    get:
      tags:
      - Projects
      summary: Check the progress and outcome of a PVsyst import
      description: 'Poll this with the ID returned by `POST /Project/Import/PVsyst`. Checking once every

        10 seconds is plenty; a large export can take several minutes.


        `status` is `Processing` while the import is running, then `Completed` or `Failed`.

        On `Completed`, `projectId` is the created project and `imported` lists the variants

        that became predictions. `skipped` lists variants that were left out, each naming the

        file references that could not be used, so an incomplete export can be corrected and

        sent again. On `Failed`, `errorCode` distinguishes a problem with the ZIP from a

        problem on the PlantPredict side.


        A partial import — some variants imported, others skipped — is a normal `Completed`

        outcome, not an error. If no variant could be imported the job is `Failed` and no

        project is created.


        An import is visible only to the account that created it.


        **Parameters:**


        - `jobId` (path, required): The import job ID returned by `POST /Project/Import/PVsyst`.

        '
      operationId: getPVsystImportStatus
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The current state of the import job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PVsystImportStatusResult'
              example:
                jobId: 4471
                status: Completed
                originalFileName: Desert Ridge.zip
                projectId: 88213
                projectName: Desert Ridge
                summary: Imported 7 of 9 variants. 2 skipped because files they reference are missing from the ZIP or could not be read.
                errorCode: null
                error: null
                imported:
                - variantFile: Desert Ridge.VC0
                  predictionId: 90112
                skipped:
                - variantFile: Desert Ridge.VC3
                  reason: References CS7N-695TB-AG.PAN, which could not be used.
                  blockedBy:
                  - category: module
                    fileName: CS7N-695TB-AG.PAN
                    problem: Not included in the ZIP.
                failed: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
