  /Project/{projectId}/Note:
    get:
      tags:
      - Projects
      summary: Get notes for a project
      description: 'Returns all notes for a project. Notes are attached at the project level.


        **Parameters:**


        - `projectId` (path, required): The project ID.

        '
      operationId: getProjectNotes
      x-doc-source: postman
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
              examples:
                postman-notes:
                  value:
                  - id: 34516
                    date: '2026-02-09T12:57:51.423'
                    contents: Example Project Note.
                    ownerId: 8903
                    entityType: 1
                    entityID: 187749
                  - id: 34517
                    date: '2026-02-09T12:58:23.2'
                    contents: Second example Project Note.
                    ownerId: 8903
                    entityType: 1
                    entityID: 187749
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Projects
      summary: Add a note to a project
      description: "Creates a new note for a project. Returns the created note ID. Note is automatically associated with the project and current user.\n\n**Parameters:**\n\n- `projectId` (path, required): The project ID.\n    \n- `note` (body, required): The Note entity (EntityType and EntityID are set automatically).\n"
      operationId: createProjectNote
      x-doc-source: postman
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
            examples:
              postman-projects-project-notes:
                value:
                  contents: Doc Demo Note
      responses:
        '200':
          description: Created note ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              examples:
                postman-notes:
                  value:
                    id: 34517
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /Project/{projectId}/Note/{noteId}:
    delete:
      tags:
      - Projects
      summary: Delete a project note
      description: "Deletes a note from a project by note ID. Returns true on success, false if delete fails.\n\n**Parameters:**\n\n- `projectId` (path, required): The project ID.\n    \n- `noteId` (path, required): The note ID to delete.\n"
      operationId: deleteProjectNote
      x-doc-source: postman
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
      - name: noteId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Remaining notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
              examples:
                postman-notes:
                  value:
                  - id: 34516
                    date: '2026-02-09T12:57:51.423'
                    contents: Example Project Note.
                    ownerId: 8903
                    entityType: 1
                    entityID: 187749
                  - id: 34517
                    date: '2026-02-09T12:58:23.2'
                    contents: Second example Project Note.
                    ownerId: 8903
                    entityType: 1
                    entityID: 187749
                postman-notes-2:
                  value: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  schemas:
    NoteCreate:
      type: object
      required:
      - contents
      properties:
        contents:
          type: string
    StatusChangeItem:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: integer
        status:
          type: integer
    ModelStateError:
      type: object
      description: 'ASP.NET Web API validation error. `modelState` maps the offending

        field name (or `request`) to a list of human-readable messages.

        '
      properties:
        message:
          type: string
        modelState:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - message
    PVsystImportStartResult:
      type: object
      description: 'Returned when a PVsyst import is accepted. No project exists yet — poll `statusUrl`

        until the job reaches a terminal status.

        '
      properties:
        jobId:
          type: integer
          format: int64
          description: 'Identifier for this import. Worth logging: it is the fastest way for support to

            find a specific import.

            '
        statusUrl:
          type: string
          description: Relative URL to poll for the import status.
      required:
      - jobId
    PVsystImportStatusResult:
      type: object
      description: The state and outcome of a PVsyst import job.
      properties:
        jobId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - Processing
          - Completed
          - Failed
          description: '`Processing` — still running, check again shortly.

            `Completed` — finished; `projectId` is the new project.

            `Failed` — no project was created; `errorCode` says why.

            '
        originalFileName:
          type:
          - string
          - 'null'
          description: The uploaded ZIP filename.
        projectId:
          type:
          - integer
          - 'null'
          format: int64
          description: The created project. Null until the import completes successfully.
        projectName:
          type:
          - string
          - 'null'
        summary:
          type:
          - string
          - 'null'
          description: 'One sentence describing the outcome in plain language, suitable to relay to a

            person as-is without counting array lengths.

            '
        errorCode:
          type:
          - string
          - 'null'
          description: "Set only when `status` is `Failed`. One of:\n\n* `no-importable-variants` — not one variant could be imported; `skipped` lists\n  every file that needs fixing. Correct the export and send it again.\n* `invalid-zip` — the upload could not be read as a PVsyst export, or contained\n  no variants. Correct the export and send it again.\n* `import-error` — a fault on the PlantPredict side. Contact support with the\n  `jobId`; retrying the same ZIP will not help.\n"
        error:
          type:
          - string
          - 'null'
          description: Free-form detail accompanying `errorCode`.
        imported:
          type:
          - array
          - 'null'
          description: Variants that became predictions. Empty until the import finishes.
          items:
            $ref: '#/components/schemas/PVsystImportedVariant'
        skipped:
          type:
          - array
          - 'null'
          description: 'Variants left out because a file they reference could not be used. Everything

            that could be imported still was.

            '
          items:
            $ref: '#/components/schemas/PVsystSkippedVariant'
        failed:
          type:
          - array
          - 'null'
          description: Variants that errored during creation.
          items:
            $ref: '#/components/schemas/PVsystFailedVariant'
      required:
      - jobId
      - status
    Project:
      type: object
      required:
      - name
      - latitude
      - longitude
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        elevation:
          type: number
          format: double
        country:
          type: string
        countryCode:
          type: string
        stateProvince:
          type: string
        stateProvinceCode:
          type: string
        locality:
          type: string
        region:
          type: string
        standardOffsetFromUTC:
          type: number
        status:
          type: integer
          description: ProjectStatusEnum
          enum:
          - 0
          - 1
          - 2
          x-enum-varnames:
          - Active
          - Archived
          - VoltagePro
        predictions:
          type:
          - array
          - 'null'
          items:
            type: object
        companyId:
          type: integer
          readOnly: true
        createdDate:
          type: string
          readOnly: true
          description: ISO-8601 datetime as returned by the PlantPredict API. May or may not include a timezone offset; treat as server-local when no offset is present.
