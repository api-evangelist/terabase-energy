          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          x-enum-varnames:
          - Manufacturer
          - PVsyst
          - UniversityOfGeneva
          - Photon
          - SandiaDatabase
          - Custom
          - PlantPredict
          description: DataSourceType
        inverterType:
          type: integer
          enum:
          - 0
          - 1
          - 2
          x-enum-varnames:
          - Unspecified
          - String
          - Central
          description: InverterType
        efficiencyCurves:
          type:
          - array
