          - 'null'
          items:
            type: object
        pqCurves:
          type:
          - array
          - 'null'
          items:
            type: object
        companyId:
          type: integer
          readOnly: true
        ownerId:
          type: integer
          readOnly: true
        createdDate:
          type: string
          readOnly: true
