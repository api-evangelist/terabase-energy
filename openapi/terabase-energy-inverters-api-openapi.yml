          description: kW
        apparentPower:
          type: number
        minDCPowerThreshold:
          type: number
        minVoltage:
          type: number
        maxMPPVoltage:
          type: number
        maxAbsoluteVoltage:
          type: number
        maxCurrent:
          type: number
        maxElevation:
          type: number
        outputVoltage:
          type: number
        usekVACurves:
          type: boolean
        usePQCurves:
          type: boolean
        dataSource:
