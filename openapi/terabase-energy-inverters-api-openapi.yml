components:
  schemas:
    StatusChangeItem:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: integer
        status:
          type: integer
    ModelStateError:
      type: object
      description: 'ASP.NET Web API validation error. `modelState` maps the offending

        field name (or `request`) to a list of human-readable messages.

        '
      properties:
        message:
          type: string
        modelState:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - message
    InverterOverview:
      type: object
      properties:
        id:
          type: integer
        ownerId:
          type: integer
        name:
          type: string
        status:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          x-enum-varnames:
          - Unknown
          - DraftPrivate
          - DraftShared
          - Active
          - Retired
          - Global
          - GlobalRetired
          description: LibraryStatusEnum
        lastModified:
          type: string
          description: ISO-8601 datetime as returned by the PlantPredict API. May or may not include a timezone offset; treat as server-local when no offset is present.
        lastModifiedBy:
          type: string
        model:
          type: string
        manufacturer:
          type: string
        powerRated:
          type: number
        outputVoltage:
          type: number
        minVoltage:
          type: number
        maxMPPVoltage:
          type: number
        inverterType:
          type: integer
          enum:
          - 0
          - 1
          - 2
          x-enum-varnames:
          - Unspecified
          - String
          - Central
          description: InverterType
    Inverter:
      type: object
      required:
      - name
      - manufacturer
      - model
      - powerRated
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        status:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          x-enum-varnames:
          - Unknown
          - DraftPrivate
          - DraftShared
          - Active
          - Retired
          - Global
          - GlobalRetired
          description: LibraryStatusEnum
        model:
          type: string
        manufacturer:
          type: string
        powerRated:
