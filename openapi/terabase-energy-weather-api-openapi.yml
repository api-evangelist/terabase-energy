  /Weather/Download/{providerId}:
    post:
      tags:
      - Weather
      summary: Download weather data from a provider
      description: Fetches weather data from an external provider (SolarAnywhere, Meteonorm, NSRDB, etc.) for a given latitude/longitude and persists it as a new weather file in the company library. The `providerId` path parameter is the integer enum value for the provider; see `WeatherDataProvider` via `GET /Definitions` for the full catalog.
      operationId: downloadWeather
      x-doc-source: drafted
      parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: integer
      - name: Latitude
        in: query
        required: true
        schema:
          type: number
      - name: Longitude
        in: query
        required: true
        schema:
          type: number
      - name: Provider
        in: query
        required: true
        schema:
          type: integer
      - name: CPRVersion
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Created weather ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
            text/plain:
              examples:
                postman-download:
                  value: "{\n    \"id\": 231188 // API returns the newly created weather file ID\n}"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
