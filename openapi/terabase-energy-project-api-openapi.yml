      summary: Get Projects for which you have access and are within a certain mile radius of a latitude,
        longitude point.
      parameters:
      - name: latitude
        in: query
        description: ''
        schema:
          type: number
          format: double
      - name: longitude
        in: query
        description: ''
        schema:
          type: number
          format: double
      - name: searchRadius
        in: query
        description: Miles
        schema:
          type: number
          format: double
      responses:
        '200':
          description: OK
          content:
