openapi: 3.2.0
info:
  title: PlantPredict Project API
  description: The HTTP API used by the PlantPredict web application. This API can also be accessed directly
    by having your Company Admin generate API credentials. If you do not know your Company Admin, contact
    support@plantpredict.com for assistance.
  contact:
    name: PlantPredict Support
    url: https://plantpredict.com/contact/
    email: support@plantpredict.com
  version: current
security:
- Bearer: []
tags:
- name: Project
paths:
  /Project/{id}:
    get:
      tags:
      - Project
      summary: Get a Project by Id.
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.Project'
            application/json:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.Project'
            text/json:
              schema:
                $ref: '#/components/schemas/PlantPredict.Entities.Project'
    delete:
      tags:
      - Project
      summary: Delete a Project by Id.
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
    put:
      tags:
      - Project
      summary: Update a Project.
      description: This operation may attach a X-Message header on the response indicating a non-blocking
        warning about the updated entity.
      parameters:
      - name: id
        in: path
        description: Project ID from URL
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Project'
          application/json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Project'
          text/json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Project'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PlantPredict.Entities.Project'
      responses:
        '200':
          description: OK
  /Project/My:
    get:
      tags:
      - Project
      summary: Get all Projects you own.
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/PlantPredict.Entities.Enums.ProjectStatusEnum'
      responses:
        '200':
          description: OK
          content:
