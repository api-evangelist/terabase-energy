apis:
- name: PlantPredict MCP Connector
  description: >-
    Hosted Model Context Protocol server that lets Claude, ChatGPT and Cursor act on a user's own PlantPredict
    account — creating and running predictions, importing weather and shade scenes, browsing projects
    and reading results in natural language. Protected by OAuth 2.0 (authorization code + PKCE S256) with
    RFC 9728 protected-resource metadata and RFC 7591 dynamic client registration. Requires a PlantPredict
    Pro or Enterprise subscription and an administrator to enable "Allow MCP Server Access For API Users".
  humanURL: https://docs.plantpredict.com/user-guide/knowledge-base/connecting-mcp-connector
  baseURL: https://mcp.plantpredict.terabase.energy
  tags:
  - MCP
  - agent-native
  - Solar
  - Energy Modeling
  tags_raw:
  - mcp
  - agent-native
  - solar
  - energy-modeling
  properties:
  - type: MCPServer
    url: mcp/terabase-energy-mcp.yml
  - type: ToolCrosswalk
    url: mcp/terabase-energy-tool-crosswalk.yml
  - type: MCPServer
    url: https://mcp.plantpredict.terabase.energy
  - type: Documentation
    url: https://docs.plantpredict.com/user-guide/knowledge-base/connecting-mcp-connector
  - type: WellKnown
    url: well-known/terabase-energy-well-known.yml
- name: Terrain Pro API
  description: >-
    Terabase Energy's terrain analysis and solar site-planning API, used by the Terrain Pro application
    for elevation data extraction, layout generation, grading/earthwork solutions, pile binning and reveal
    reporting, wind-rack summaries and satellite search. The endpoint surface is documented in Terabase's
    public Terrain Pro API documentation app; the API itself requires authentication (probed anonymously
    it returns HTTP 403 "Authentication credentials were not provided"), and no machine-readable specification
    is published.
  humanURL: https://terrain-pro-api-doc-app.s3.us-west-2.amazonaws.com/index.html
  baseURL: https://services.terabase.energy/tools/api/v1/terrain-pro
  tags:
  - terrain-analysis
  - Geospatial
  - Solar
  - utility-scale-solar
  - Construction Technology
  tags_raw:
  - terrain-analysis
  - geospatial
  - solar
  - utility-scale-solar
  - construction-technology
  properties:
  - type: Documentation
    url: https://terrain-pro-api-doc-app.s3.us-west-2.amazonaws.com/index.html
  x-surface:
    state: gated
    reason: customer-only-docs
    detail: >-
      The Terrain Pro API is documented publicly but every endpoint requires an authenticated Terabase
      Tools account; an anonymous GET of the collection root returns a Django REST Framework 403 with
      "Authentication credentials were not provided." and no OpenAPI/schema route is served.
    evidence:
    - url: https://services.terabase.energy/tools/api/v1/terrain-pro/
      status: 403
    - url: https://services.terabase.energy/tools/api/schema/
      status: 200
    checked: '2026-08-05'
