- name: Terrain Pro API
  description: >-
    Terabase Energy's terrain analysis and solar site-planning API, used by the Terrain Pro application for elevation
    data extraction, layout generation, grading/earthwork solutions, pile binning and reveal reporting, wind-rack
    summaries and satellite search. The endpoint surface is documented in Terabase's public Terrain Pro API
    documentation app; the API itself requires authentication (probed anonymously it returns HTTP 403
    "Authentication credentials were not provided"), and no machine-readable specification is published.
  humanURL: https://terrain-pro-api-doc-app.s3.us-west-2.amazonaws.com/index.html
  baseURL: https://services.terabase.energy/tools/api/v1/terrain-pro
  tags:
