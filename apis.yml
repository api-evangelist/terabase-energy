- name: PlantPredict MCP Connector
  description: >-
    Hosted Model Context Protocol server that lets Claude, ChatGPT and Cursor act on a user's own PlantPredict account
    — creating and running predictions, importing weather and shade scenes, browsing projects and reading results in
    natural language. Protected by OAuth 2.0 (authorization code + PKCE S256) with RFC 9728 protected-resource metadata
    and RFC 7591 dynamic client registration. Requires a PlantPredict Pro or Enterprise subscription and an
    administrator to enable "Allow MCP Server Access For API Users".
  humanURL: https://docs.plantpredict.com/user-guide/knowledge-base/connecting-mcp-connector
  baseURL: https://mcp.plantpredict.terabase.energy
  tags:
  - mcp
  - agent-native
  - solar
  - energy-modeling
