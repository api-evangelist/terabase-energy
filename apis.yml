aid: terabase-energy
name: Terabase Energy
description: >-
  Terabase Energy builds digital and automation technology for the full lifecycle of utility-scale solar power
  plants — engineering and energy modeling, robotic field construction, and plant operations. Its software portfolio
  includes PlantPredict, an industry-standard bankable performance-modeling platform for utility-scale PV that
  predicts energy yield from early-stage prospecting through operational monitoring; Terrain Pro, a terrain analysis,
  grading and pile-layout engine for site design; Construct, a construction management platform; and Terafab, an
  automated field-factory system for solar module installation. PlantPredict exposes its entire modeling engine as a
  documented REST API (OpenAPI 3.1, OAuth 2.0 client-credentials via AWS Cognito), an official Python SDK, a Postman
  collection, and a hosted, OAuth-protected Model Context Protocol (MCP) connector for Claude, ChatGPT and Cursor.
