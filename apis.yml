apis:
- name: PlantPredict Performance API
  description: >-
    The REST API behind PlantPredict, Terabase Energy's utility-scale solar performance-modeling platform. It exposes
    the full modeling engine — projects, predictions, power plant designs (blocks/arrays/inverters/DC fields), weather
    files, module and inverter libraries, 3D shade scenes, terrain-aware backtracking, time-series inputs, financial
    models and results — over 113 documented operations. Authentication is OAuth 2.0 client credentials against AWS
    Cognito, presented on the wire as a JWT bearer token.
  humanURL: https://docs.plantpredict.com/api-docs/intro
  baseURL: https://api.plantpredict.terabase.energy
