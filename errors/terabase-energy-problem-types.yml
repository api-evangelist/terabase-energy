format_note: >-
  NOT RFC 9457. PlantPredict returns no `application/problem+json` anywhere in the spec. Errors arrive in one of three
  shapes and clients are told explicitly to branch on Content-Type: an ASP.NET Web API model-state JSON envelope, a
  free-form `text/plain` message, or an empty body where the status code is the only signal.
